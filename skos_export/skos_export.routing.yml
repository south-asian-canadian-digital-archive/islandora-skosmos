skos_export.settings:
  path: '/admin/config/services/skos-export'
  defaults:
    _form: '\Drupal\skos_export\Form\SettingsForm'
    _title: 'SKOS export'
  requirements:
    _permission: 'administer skos export'
skos_export.vocabulary:
  path: '/skos-export/{vocabulary}'
  defaults:
    _controller: '\Drupal\skos_export\Controller\SkosExportController::export'
  requirements:
    _permission: 'access content'
    vocabulary: '[a-z0-9_]+'
route_callbacks:
  - '\Drupal\skos_export\Routing\ConceptRoutes::routes'
